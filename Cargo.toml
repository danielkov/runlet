[package]
name = "runlet"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
authors = ["Daniel Kovacs"]
description = "A semantic executable model for the Runlet orchestration language"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danielkov/runlet"
homepage = "https://github.com/danielkov/runlet"
documentation = "https://docs.rs/runlet"
readme = "README.md"
keywords = ["agents", "llm", "orchestration", "language", "runtime"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
hex = "0.4"
regex = "1"
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt"], optional = true }
unicode-ident = "1"

[features]
# Async tool handlers and `Runtime::run_async`, driven by the host's Tokio runtime.
tokio = ["dep:tokio"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "async_tools"
required-features = ["tokio"]
